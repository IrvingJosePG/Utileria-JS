<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login de App</title>
        <link rel="stylesheet" href="css/styles.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    </head>

    <body>
        <div class="contenedor-formulario">
            <h1>Inicio de Sesión</h1>
            <p class="subtitulo">Ingrese correctamente sus credenciales</p>
            
            <form class="formulario" id="formulariologin">
                <div class="grupo-formulario">
                    <label for="correo">Correo Electrónico</label>
                    <input type="text" id="correo" placeholder="Ej. juan@gmail.com">
                    <span id="errorCorreo" class="mensaje-error"></span>
                </div>

                <div class="grupo-formulario">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="*********">
                    <span id="errorPassword" class="mensaje-error"></span>
                </div>

                <button type="submit" class="boton-enviar">
                    Ingresar <span> → </span>
                </button>
            </form>
        </div>
        
        <script src="js/utileria.js"></script>

        <script>
            var formLogin = document.getElementById("formulariologin");
            var inputCorreo = document.getElementById("correo");
            var inputPassword = document.getElementById("password");
            var errorCorreo = document.getElementById("errorCorreo");
            var errorPassword = document.getElementById("errorPassword");

            formLogin.addEventListener("submit", function(evento) {
                evento.preventDefault();

                var correoValor = inputCorreo.value.trim();
                var passwordValor = inputPassword.value.trim();
                errorCorreo.textContent = "";
                errorPassword.textContent = "";
                inputCorreo.classList.remove("campo-error");
                inputPassword.classList.remove("campo-error");

                if (!validarCorreo(correoValor)) {
                    errorCorreo.textContent = "Por favor, introduce un formato de correo electrónico correcto.";
                    inputCorreo.classList.add("campo-error");
                }

                if (!validarPassword(passwordValor)) {
                    errorPassword.textContent = "La contraseña debe tener al menos 8 caracteres, mayúsculas, minúsculas, un número y un carácter especial.";
                    inputPassword.classList.add("campo-error");
                }

                if (errorCorreo.textContent || errorPassword.textContent) {
                    return;
                }

                Swal.fire({
                    icon: 'success',
                    title: 'Bienvenido',
                    text: 'Las credenciales son validas.'
                }).then(() => {
                    window.location.href = "index.html";
                });
            });
        </script>
    </body>
</html>
